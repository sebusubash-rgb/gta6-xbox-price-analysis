name: Refresh final hero chart after independent review
on:
  push:
    paths:
      - '.github/workflows/refresh-final-hero.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Reproduce updated hero figure
        run: python social_visuals.py
      - name: Publish updated hero image and remove this one-time workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refresh-final-hero.yml
          git add figures/hero_LinkedIn_USD.png .github/workflows/refresh-final-hero.yml
          git diff --cached --quiet || { git commit -m "Apply independent-review corrections to final hero chart"; git push origin HEAD:main; }
