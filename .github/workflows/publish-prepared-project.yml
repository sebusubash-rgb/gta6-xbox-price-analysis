name: Publish prepared Xbox price study
on:
  push:
    paths:
      - '.github/workflows/publish-prepared-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract reviewed research files and remove uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          archive="gta6-xbox-price-analysis-github-ready.zip"
          test -f "$archive"
          mkdir -p /tmp/portfolio_extract
          unzip -q "$archive" -d /tmp/portfolio_extract
          test -f /tmp/portfolio_extract/gta6-xbox-price-analysis/README.md
          test -f /tmp/portfolio_extract/gta6-xbox-price-analysis/analyze.py
          test -f /tmp/portfolio_extract/gta6-xbox-price-analysis/figures/ebay_monthly_medians.png
          cp -a /tmp/portfolio_extract/gta6-xbox-price-analysis/. .
          rm -f "$archive" .github/workflows/publish-prepared-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Publish cleaned research, aggregate data, charts and code"; git push origin HEAD:main; }
