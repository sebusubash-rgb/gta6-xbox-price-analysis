name: Publish reviewed fast-reading Xbox figures
on:
  push:
    paths:
      - '.github/workflows/publish-social-figures.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Recreate original technical and accessible public figures
        run: |
          python public_visuals.py
          python social_visuals.py
      - name: Commit high-resolution figures and clean up one-time workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/publish-social-figures.yml
          git add figures/hero_LinkedIn_USD.png figures/full_year_context_USD.png figures/final_ebay_vs_klein_EUR_comparison.png .github/workflows/publish-social-figures.yml
          git diff --cached --quiet || { git commit -m "Publish simple verified portfolio charts and EUR caveats"; git push origin HEAD:main; }
