name: Generate public EUR-comparison charts
on:
  push:
    paths:
      - '.github/workflows/generate-eur-comparison.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas matplotlib
      - name: Render comparable EUR figures from saved historical ECB rates
        run: python fx_comparison.py
      - name: Publish results and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/generate-eur-comparison.yml
          git add data/ebay_daily_estimated_EUR.csv data/shared_dates_EUR_comparison.csv figures/comparison_both_EUR_OctNov.png figures/ebay_AugNov_estimated_EUR.png figures/ebay_monthly_estimated_EUR.png .github/workflows/generate-eur-comparison.yml
          git diff --cached --quiet || { git commit -m "Publish historical FX-normalised EUR figures and daily comparisons"; git push origin HEAD:main; }
